name: daily-report

# Fully automated daily path (no cost, no API key):
#   1) generate.ts  — free market data (stooq) + real news (Google News RSS)
#                     turned into report.json by GitHub Models (gpt-4o) via the
#                     built-in GITHUB_TOKEN (permissions: models: read).
#   2) finalize.ts  — KIS-anchor quotes, render images, upsert Supabase.
#
# This is the *baseline* (unattended, guaranteed). The Claude self-bind routine
# fires ~15 min later and, when the session is warm, republishes a premium
# report that overwrites this day's row. It does NOT commit report.json, so the
# Claude-authored file in git is never clobbered.
#
# Runs on Actions' open network with the repo checked out, so it does not suffer
# the scheduled-container "no repo cloned" failure the Max-dispatch path hit.
on:
  schedule:
    - cron: "50 20 * * *" # 05:50 KST (20:50 UTC) — baseline done well before 06:15
  workflow_dispatch: {}

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: read
  models: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate report.json (free data + GitHub Models)
        working-directory: packages/pipeline
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
          GITHUB_MODELS_ENDPOINT: ${{ vars.GITHUB_MODELS_ENDPOINT }}
          PIPELINE_OUT: ${{ github.workspace }}/reports

      - name: Finalize + persist to Supabase
        working-directory: packages/pipeline
        run: npm run finalize
        env:
          PIPELINE_OUT: ${{ github.workspace }}/reports
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          AI_HEADER_ENABLED: ${{ vars.AI_HEADER_ENABLED }}
          IMAGE_API_URL: ${{ vars.IMAGE_API_URL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
