name: finalize-report

# Triggered when the dispatch agent pushes a fresh reports/report.json.
# Runs on GitHub's open network: fetches quotes, renders images, and writes
# the report to Supabase (no LLM key needed — the dispatch did that on Max).
on:
  push:
    branches: ["**"]
    paths:
      - "reports/report.json"
  workflow_dispatch: {}

concurrency:
  group: finalize-report
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Finalize + persist to Supabase
        working-directory: packages/pipeline
        run: npm run finalize
        env:
          PIPELINE_OUT: ${{ github.workspace }}/reports
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          AI_HEADER_ENABLED: ${{ vars.AI_HEADER_ENABLED }}
          IMAGE_API_URL: ${{ vars.IMAGE_API_URL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
